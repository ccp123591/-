spring:
  profiles:
    active: dev
  application:
    name: fitcoach-backend

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: 8080
  servlet:
    context-path: /

# JWT 配置
jwt:
  secret: fitcoach-jwt-secret-key-please-change-in-production-2026
  access-token-expire-hours: 2
  refresh-token-expire-days: 30

# AI 教练配置（mock / mimo）
ai:
  coach:
    enabled: true
    provider: ${AI_COACH_PROVIDER:mock}        # mock | mimo
    mimo:
      api-key: ${MIMO_API_KEY:}
      base-url: ${MIMO_BASE_URL:https://api.xiaomimimo.com/v1}
      model: ${MIMO_MODEL:mimo-v2-flash}
      max-tokens: 600
      temperature: 0.7
      timeout-seconds: 20
  # 向量记忆 RAG
  memory:
    enabled: ${AI_MEMORY_ENABLED:true}
    store: ${AI_MEMORY_STORE:memory}            # memory（dev/小规模）| redis（未来 RediSearch）
    embedding: ${AI_MEMORY_EMBEDDING:mock}      # mock | openai
    max-per-user: 500
    recall-top-k: 3
  # 语音 TTS — 主 mimo，云不可用时 service 自动 fallback 到 browser（前端 Web Speech API 朗读）
  tts:
    provider: ${AI_TTS_PROVIDER:browser}        # mimo | browser
    mimo:
      api-key: ${MIMO_TTS_API_KEY:${MIMO_API_KEY:}}
      base-url: ${MIMO_TTS_BASE_URL:https://api.xiaomimimo.com/v1}
      model: ${MIMO_TTS_MODEL:mimo-v2-tts}
      voice: ${MIMO_TTS_VOICE:default_zh}
      format: ${MIMO_TTS_FORMAT:wav}

# 环境建模 vision-svc
vision:
  base-url: ${VISION_BASE_URL:http://localhost:8081}
  timeout-seconds: ${VISION_TIMEOUT_SECONDS:30}
  # 环境安全评估不应把 hash 占位结果当作真实识别入库。
  allow-placeholder-results: ${VISION_ALLOW_PLACEHOLDER_RESULTS:false}

# 文件上传
upload:
  dir: ./uploads
  max-size: 10MB

# 跨域（逗号分隔，供 @Value List<String> 绑定）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8080}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: FitCoach API
    version: 3.0.0

# Actuator 健康检查（只暴露最小必要端点）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 日志
logging:
  level:
    root: INFO
    com.fitcoach: DEBUG
    org.springframework.security: INFO
